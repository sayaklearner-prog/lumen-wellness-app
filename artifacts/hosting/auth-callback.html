<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen OS - Authentication Successful</title>
  <style>
    :root {
      --bg: #060c09;
      --card-bg: #0d1a14;
      --accent: #10b981;
      --accent-glow: #34d399;
      --text: #f0fdf4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--accent-glow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .check-icon {
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.2);
      border: 2px solid var(--accent-glow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent-glow);
      font-size: 32px;
    }
    h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 0 10px;
      color: #fff;
    }
    p {
      color: #a7f3d0;
      font-size: 0.95rem;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #050b08;
      font-weight: 800;
      text-decoration: none;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 1rem;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      letter-spacing: 0.5px;
    }
    .btn:active {
      transform: scale(0.98);
      background: var(--accent-glow);
    }
    .user-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent-glow);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="status-icon" class="spinner"></div>
    <div id="user-info" class="user-pill" style="display: none;"></div>
    <h2 id="title">Signing in to Lumen OS...</h2>
    <p id="subtitle">Redirecting back to the Lumen OS application.</p>
    <a href="#" id="open-app-btn" class="btn" style="display: none;">Open Lumen OS App</a>
  </div>

  <script>
    (function() {
      var hash = window.location.hash || window.location.search || "";
      if (!hash) {
        document.getElementById("status-icon").style.display = "none";
        document.getElementById("title").textContent = "Sign-In Required";
        document.getElementById("subtitle").textContent = "No credentials received. Please sign in through the Lumen app.";
        return;
      }

      var deepLinkUrl = "lumen://oauth" + hash;
      var intentUrl = "intent://oauth" + hash + "#Intent;scheme=lumen;package=com.meshmind.lumen;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end";

      // Show user email if decoded from JWT
      try {
        var params = new URLSearchParams(hash.replace(/^[#?]/, ''));
        var idToken = params.get("id_token");
        if (idToken) {
          var payload = JSON.parse(atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          if (payload && (payload.email || payload.name)) {
            var userInfo = document.getElementById("user-info");
            userInfo.textContent = "Signed in as: " + (payload.name || payload.email);
            userInfo.style.display = "inline-block";
          }
        }
      } catch (e) {}

      var icon = document.getElementById("status-icon");
      icon.className = "check-icon";
      icon.innerHTML = "&#10003;";

      var title = document.getElementById("title");
      title.textContent = "Sign-In Successful!";

      var subtitle = document.getElementById("subtitle");
      subtitle.textContent = "Returning you to Lumen OS...";

      var btn = document.getElementById("open-app-btn");
      btn.href = deepLinkUrl;
      btn.onclick = function(e) {
        window.location.href = deepLinkUrl;
        setTimeout(function() {
          window.location.href = intentUrl;
        }, 500);
      };
      btn.style.display = "block";

      // Trigger automatic deep link redirect
      window.location.href = deepLinkUrl;
      setTimeout(function() {
        window.location.href = intentUrl;
      }, 400);
    })();
  </script>
</body>
</html>
